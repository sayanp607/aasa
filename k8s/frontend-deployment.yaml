apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: aasa
  labels:
    app: aasa-frontend
    tier: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aasa-frontend
  template:
    metadata:
      labels:
        app: aasa-frontend
        tier: web
    spec:
      containers:
        - name: frontend
          image: sayanp607/aasa-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
